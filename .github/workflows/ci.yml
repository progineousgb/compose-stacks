name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stacks pass with every value set
        run: |
          for d in */; do
            [ -f "$d/compose.yaml" ] || continue
            (cd "$d" && sed 's/=$/=placeholder/' .env.example > .env && docker compose config -q && echo "ok $d")
            rm -f "$d/.env"
          done
      - name: Stacks fail while a required secret is empty
        run: |
          for d in */; do
            [ -f "$d/compose.yaml" ] || continue
            required=no
            for k in $(sed -n 's/^\([A-Z0-9_]*\)=$/\1/p' "$d/.env.example"); do
              if grep -q "\${$k:?" "$d/compose.yaml"; then required=yes; fi
            done
            [ "$required" = yes ] || continue
            cp "$d/.env.example" "$d/.env"
            if (cd "$d" && docker compose config -q 2>/dev/null); then
              echo "$d started with an empty required secret"; exit 1
            fi
            rm -f "$d/.env"
            echo "ok $d"
          done
